<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#22303F" />
  <title>Messire Paulochon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" />
  <style>
    html, body { margin: 0; height: 100%; background: #22303F; overflow: hidden; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #game { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    /* Précharge les polices pour que Phaser puisse les utiliser dans les textes canvas */
    .font-warmup { position: absolute; left: -9999px; visibility: hidden; }
  </style>
</head>
<body>
  <div id="game"></div>
  <span class="font-warmup" style="font-family: Bangers">.</span>
  <span class="font-warmup" style="font-family: 'Patrick Hand'">.</span>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
