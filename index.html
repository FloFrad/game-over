<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#22303F" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Paulochon" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Messire Paulochon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" />
  <style>
    html, body { margin: 0; height: 100%; background: #22303F; overflow: hidden; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #game { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    /* Précharge les polices pour que Phaser puisse les utiliser dans les textes canvas */
    /* Tablette en portrait : le jeu est prévu en paysage, on demande de tourner l'écran */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #22303F; color: #FFF8E7; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; font-family: Bangers, Impact, sans-serif; font-size: 44px; letter-spacing: .04em; }
    #rotate svg { width: 46vmin; height: 46vmin; }
    #rotate .tablet { transform-origin: 100px 100px; animation: turn 2.6s ease-in-out infinite; }
    @keyframes turn { 0%, 15% { transform: rotate(0deg); } 55%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    @media (prefers-reduced-motion: reduce) { #rotate .tablet { animation: none; transform: rotate(90deg); } }
    .font-warmup { position: absolute; left: -9999px; visibility: hidden; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate" role="alert">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <g class="tablet">
        <rect x="58" y="30" width="84" height="140" rx="12" fill="#FFD23F" stroke="#1A1A1A" stroke-width="8" />
        <rect x="68" y="44" width="64" height="104" rx="4" fill="#7EC8F0" stroke="#1A1A1A" stroke-width="5" />
        <circle cx="100" cy="159" r="5" fill="#1A1A1A" />
      </g>
      <path d="M160 62 Q184 100 160 138 M160 138 L150 120 M160 138 L176 126" fill="none" stroke="#FFF8E7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span>Tourne la tablette</span>
  </div>
  <span class="font-warmup" style="font-family: Bangers">.</span>
  <span class="font-warmup" style="font-family: 'Patrick Hand'">.</span>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
